trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  APIDOG_PROJECT_ID: '704579'
  WORKDIR: '$(Build.SourcesDirectory)/build/apidog'
  RELEVANT_SUBPATH: 'waySCI/Documentation'
  GENERATE_PDF: 'true'
  PDF_TEMPLATE: 'valantic.latex'
  PDF_OUTPUT: 'output.pdf'
  PDF_INPUT_FILES: 'index.md,01_Übersicht.md,02_Installation.md,03_Konfiguration.md'

steps:
  - checkout: self

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
    displayName: 'Use Python 3.11'

  - script: |
      python -m pip install --upgrade pip
      pip install requests
    displayName: 'Install Python dependencies'

  - script: |
      python apidog_pipeline_export.py --verbose
    displayName: 'Run Apidog export + image rewrite + PDF'
    env:
      APIDOG_EMAIL: $(APIDOG_EMAIL)
      APIDOG_PASSWORD: $(APIDOG_PASSWORD)
      APIDOG_PROJECT_ID: $(APIDOG_PROJECT_ID)
      WORKDIR: $(WORKDIR)
      RELEVANT_SUBPATH: $(RELEVANT_SUBPATH)
      GENERATE_PDF: $(GENERATE_PDF)
      PDF_TEMPLATE: $(PDF_TEMPLATE)
      PDF_OUTPUT: $(PDF_OUTPUT)
      PDF_INPUT_FILES: $(PDF_INPUT_FILES)

  - publish: '$(Build.SourcesDirectory)/build/apidog/extracted/waySCI/Documentation/output.pdf'
    artifact: apidog-pdf
    displayName: 'Publish generated PDF artifact'
